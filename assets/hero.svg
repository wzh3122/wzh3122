<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">WZH3122 — AI systems, built for real work</title>
  <desc id="desc">Editorial style navy profile banner with warm orange accents and an abstract W monogram</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#17283B"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC291"/><stop offset="1" stop-color="#F07757"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A4B7C9" opacity=".17"/></pattern>
    <clipPath id="edge"><rect width="1200" height="390" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
