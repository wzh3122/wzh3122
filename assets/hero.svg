    <circle cx="67" cy="61" r="5" fill="#F69A72"/>
    <text x="84" y="66" fill="#D6E0EB" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">WZH3122 / PORTFOLIO</text>
    <text x="54" y="161" fill="#F4F5F3" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Ideas into</text>
    <text x="54" y="240" fill="url(#warm)" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">working tools.</text>
    <path d="M54 270H119" stroke="#F69A72" stroke-width="4" stroke-linecap="round"/>
    <text x="54" y="309" fill="#B7C8D7" font-family="Arial, sans-serif" font-size="18" letter-spacing=".5">AI systems  ·  Knowledge retrieval  ·  Computer vision</text>
    <g transform="translate(792 85)">
      <circle cx="156" cy="116" r="159" fill="#243B4E" opacity=".54"/>
